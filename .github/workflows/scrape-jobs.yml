name: Atualizar vagas de Angola

on:
  schedule:
    - cron: '15,45 * * * *'  # duas vezes por hora, 24/7, para apanhar vagas do mesmo dia
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Número máximo de páginas a raspar (padrão 50)'
        required: false
        default: '50'
      force:
        description: 'Forçar atualização mesmo sem novas vagas?'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: scrape-jobs
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Recolher vagas (angolaemprego.com)
        continue-on-error: true
        env:
          MAX_PAGES: ${{ github.event.inputs.max_pages || '50' }}
          CONCURRENCY: '4'
          MAX_AGE_DAYS: '90'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_FALLBACK: ${{ secrets.GROQ_API_KEY_FALLBACK }}
        run: |
          node scripts/ingest-angolaemprego.mjs --json

      - name: Recolher vagas via RSS (same-day)
        continue-on-error: true
        env:
          CONCURRENCY: '4'
          MAX_AGE_DAYS: '90'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_FALLBACK: ${{ secrets.GROQ_API_KEY_FALLBACK }}
        run: |
          node scripts/ingest-rss.mjs

      - name: Recolher vagas do CareerJet (opcional)
        continue-on-error: true
        env:
          CAREERJET_API_KEY: ${{ secrets.CAREERJET_API_KEY }}
          CAREERJET_REFERER: 'https://mosalo.eu.cc/'
          MAX_AGE_DAYS: '90'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_FALLBACK: ${{ secrets.GROQ_API_KEY_FALLBACK }}
        run: |
          node scripts/ingest-careerjet.mjs

      - name: Recolher vagas do Jobartis
        continue-on-error: true
        env:
          MAX_PAGES: '15'
          CONCURRENCY: '2'
          MAX_AGE_DAYS: '90'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_FALLBACK: ${{ secrets.GROQ_API_KEY_FALLBACK }}
        run: |
          node scripts/ingest-jobartis.mjs --json

      - name: Recolher vagas do Ango Emprego
        continue-on-error: true
        env:
          MAX_JOBS: '500'
          CONCURRENCY: '4'
          MAX_AGE_DAYS: '90'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_FALLBACK: ${{ secrets.GROQ_API_KEY_FALLBACK }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: |
          node scripts/ingest-angoemprego.mjs --json

      - name: Recolher vagas do Empregos Yoyota
        continue-on-error: true
        env:
          MAX_JOBS: '500'
          CONCURRENCY: '4'
          MAX_AGE_DAYS: '90'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_FALLBACK: ${{ secrets.GROQ_API_KEY_FALLBACK }}
        run: |
          node scripts/ingest-yoyota.mjs --json

      - name: Verificar se ja houve deploy na ultima hora
        id: deploygate
        run: |
          TS=$(cat public/.last-deploy 2>/dev/null || echo 0)
          NOW=$(date +%s)
          if [ "$((NOW - TS))" -lt 3600 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Deploy feito ha menos de 1h - as vagas ficam publicadas na proxima ronda."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit se houver alterações
        if: ${{ steps.deploygate.outputs.skip != 'true' }}
        run: |
          git config user.name "mosalo-bot"
          git config user.email "bot@mosalo.eu.cc"
          git pull --rebase --autostash origin main
          git add public/external-jobs.json public/external-jobs-meta.json public/external-jobs-chunks public/vagas-data data
          if git diff --staged --quiet; then
            echo "Sem alterações nas vagas."
          else
            git commit -m "chore(vagas): atualização automática de vagas"
            git push
            echo "PUSHED=true" >> "$GITHUB_ENV"
          fi

      - name: Build e publicar na Netlify
        if: ${{ env.PUSHED == 'true' }}
        continue-on-error: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -e
          npm run build
          DEPLOY_JSON=$(npx netlify-cli deploy --dir=out --functions=netlify/functions --site=$NETLIFY_SITE_ID --auth=$NETLIFY_AUTH_TOKEN --json --message="Deploy $(date -u +%Y%m%d-%H%M%S)")
          DEPLOY_ID=$(node -e "let d=''; process.stdin.on('data', c => d += c); process.stdin.on('end', () => { const j = JSON.parse(d); if (!j.deploy_id) throw new Error('deploy_id missing'); console.log(j.deploy_id); });" <<< "$DEPLOY_JSON")
          echo "Draft deploy ID: $DEPLOY_ID"
          curl -fsS -X POST -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys/$DEPLOY_ID/restore"
          echo "Publicado na Netlify."
          date +%s > public/.last-deploy
          git config user.name "mosalo-bot"
          git config user.email "bot@mosalo.eu.cc"
          git pull --rebase --autostash origin main || true
          git add public/.last-deploy
          if ! git diff --staged --quiet; then
            git commit -m "chore(deploy): registo da ultima publicacao"
            git push || true
          fi

      - name: Sincronizar novas vagas com Supabase
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: https://mosalo.eu.cc
        run: |
          node scripts/sync-external-jobs-to-supabase.mjs

      - name: Upload artifact para depuração
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: scrape-debug
          path: |
            public/external-jobs.json
            public/vagas-data
