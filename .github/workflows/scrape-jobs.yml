name: Atualizar vagas de Angola

on:
  schedule:
    - cron: '15,45 * * * *'  # duas vezes por hora, 24/7, para apanhar vagas do mesmo dia
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Número máximo de páginas a raspar (padrão 50)'
        required: false
        default: '50'
      force:
        description: 'Forçar atualização mesmo sem novas vagas?'
        required: false
        default: 'false'

permissions:
  contents: write
  actions: read

concurrency:
  group: scrape-jobs
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Recolher vagas (angolaemprego.com)
        continue-on-error: true
        env:
          MAX_PAGES: ${{ github.event.inputs.max_pages || '50' }}
          CONCURRENCY: '4'
          MAX_AGE_DAYS: '90'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_FALLBACK: ${{ secrets.GROQ_API_KEY_FALLBACK }}
        run: |
          node scripts/ingest-angolaemprego.mjs --json

      - name: Recolher vagas via RSS (same-day)
        continue-on-error: true
        env:
          CONCURRENCY: '4'
          MAX_AGE_DAYS: '90'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_FALLBACK: ${{ secrets.GROQ_API_KEY_FALLBACK }}
        run: |
          node scripts/ingest-rss.mjs

      - name: Recolher vagas do CareerJet (opcional)
        continue-on-error: true
        env:
          CAREERJET_API_KEY: ${{ secrets.CAREERJET_API_KEY }}
          CAREERJET_REFERER: 'https://mosalo.eu.cc/'
          MAX_AGE_DAYS: '90'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_FALLBACK: ${{ secrets.GROQ_API_KEY_FALLBACK }}
        run: |
          node scripts/ingest-careerjet.mjs

      - name: Recolher vagas do Jobartis
        continue-on-error: true
        env:
          MAX_PAGES: '15'
          CONCURRENCY: '2'
          MAX_AGE_DAYS: '90'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_FALLBACK: ${{ secrets.GROQ_API_KEY_FALLBACK }}
        run: |
          node scripts/ingest-jobartis.mjs --json

      - name: Recolher vagas do Ango Emprego
        continue-on-error: true
        env:
          MAX_JOBS: '500'
          CONCURRENCY: '4'
          MAX_AGE_DAYS: '90'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_FALLBACK: ${{ secrets.GROQ_API_KEY_FALLBACK }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: |
          node scripts/ingest-angoemprego.mjs --json

      - name: Recolher vagas do Empregos Yoyota
        continue-on-error: true
        env:
          MAX_JOBS: '500'
          CONCURRENCY: '4'
          MAX_AGE_DAYS: '90'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_FALLBACK: ${{ secrets.GROQ_API_KEY_FALLBACK }}
        run: |
          node scripts/ingest-yoyota.mjs --json

      - name: Commit se houver alterações
        run: |
          git config user.name "mosalo-bot"
          git config user.email "bot@mosalo.eu.cc"
          git pull --rebase --autostash origin main
          git add public/external-jobs.json public/external-jobs-meta.json public/external-jobs-chunks public/vagas-data data
          if git diff --staged --quiet; then
            echo "Sem alterações nas vagas."
          else
            git commit -m "chore(vagas): atualização automática de vagas"
            git push
            echo "PUSHED=true" >> "$GITHUB_ENV"
          fi

      - name: Disparar deploy na Netlify
        if: ${{ env.PUSHED == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          RUNS_URL="https://api.github.com/repos/$REPO/actions/workflows/deploy-netlify.yml/runs?per_page=5&status=success"
          LAST=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "$RUNS_URL" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const r=JSON.parse(d).workflow_runs||[];console.log(r.length?new Date(r[0].updated_at).getTime():'0')}catch(e){console.log('0')}})")
          NOW=$(date +%s%3N)
          # O deploy demora ~3 min; no maximo 1 a cada 60 min.
          if [ "$LAST" != "0" ] && [ $((NOW - LAST)) -lt 3600000 ]; then
            echo "Ultimo deploy ha menos de 60 min - a publicar na proxima ronda com mudancas."
            exit 0
          fi
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/actions/workflows/deploy-netlify.yml/dispatches" -d '{"ref":"main"}')
          echo "Dispatch do deploy: HTTP $CODE"
          [ "$CODE" = "204" ] || exit 1

      - name: Sincronizar novas vagas com Supabase
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: https://mosalo.eu.cc
        run: |
          node scripts/sync-external-jobs-to-supabase.mjs

      - name: Upload artifact para depuração
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: scrape-debug
          path: |
            public/external-jobs.json
            public/vagas-data
